name: انتشار دمو روی GitHub Pages

on:
  push:
    branches:
      - main
      - claude/intelligent-meitner-FoLkv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: آماده‌سازی فایل‌های استاتیک
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/

      - name: پیکربندی Pages
        uses: actions/configure-pages@v5

      - name: بارگذاری artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: انتشار
        id: deployment
        uses: actions/deploy-pages@v4
